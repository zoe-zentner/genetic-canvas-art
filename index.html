<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Genetic Art</title>
    </head>
    <body>
        <div id="app">
            <!-- the original target image for comparison -->
            <canvas id="targetCanvas" width="256" height="256"></canvas>

            <!-- 256x256 keeps the pixel-matching math fast -->
            <canvas id="artCanvas" width="256" height="256"></canvas>

            <div id="dashboard">
                <h2>Evolution Stats</h2>
                <p>Generation: <span id="ui-gen">0</span></p>
                <p>Polygons: <span id="ui-poly">5</span></p>
                <p>Error Score: <span id="ui-score">0</span></p>
                <p>Temperature: <span id="ui-temp">1.00</span></p>

                <div id="controls">
                    <button id="toggle-sim" type="button">Pause</button>
                    <button id="reset-sim" type="button" class="secondary">Reset</button>
                    <button id="export-svg" type="button" class="secondary">Export SVG</button>
                    <label for="image-upload" class="secondary upload-button">Upload Image</label>
                    <input id="image-upload" type="file" accept="image/*" hidden />
                </div>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
